  <circle cx="142" cy="142" r="85" fill="#4A9B9B" stroke="#4A9B9B" stroke-width="4"/>
  
  <!-- Gorro de chef turquesa -->
  <path d="M100 90 C100 70, 120 50, 142 50 C164 50, 184 70, 184 90 L184 100 C184 110, 174 120, 142 120 C110 120, 100 110, 100 100 Z" fill="#4A9B9B"/>
  <rect x="105" y="115" width="74" height="12" rx="6" fill="#4A9B9B"/>
  
