<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Círculo exterior azul marino -->
  <circle cx="20" cy="20" r="18" fill="#1B365D"/>
  
  <!-- Círculo interior turquesa -->
  <circle cx="20" cy="20" r="15" fill="#4A9B9B"/>
  
  <!-- Gorro de chef -->
  <path d="M12 12 C12 8, 15 5, 20 5 C25 5, 28 8, 28 12 L28 14 C28 16, 26 18, 20 18 C14 18, 12 16, 12 14 Z" fill="#4A9B9B"/>
  <rect x="13" y="17" width="14" height="2" rx="1" fill="#4A9B9B"/>
  
  <!-- Pantalla del dispositivo -->
  <rect x="15" y="19" width="10" height="12" rx="2" fill="white" stroke="#4A9B9B" stroke-width="1"/>
  
  <!-- Tenedor y cuchillo naranjas -->
  <g transform="translate(20, 25)">
    <!-- Tenedor -->
    <g transform="translate(-2, -2)">
      <rect x="-0.2" y="0" width="0.4" height="4" fill="#E67E22"/>
      <rect x="-0.6" y="-1.5" width="0.4" height="1.5" fill="#E67E22"/>
      <rect x="-0.2" y="-1.5" width="0.4" height="1.5" fill="#E67E22"/>
      <rect x="0.2" y="-1.5" width="0.4" height="1.5" fill="#E67E22"/>
    </g>
    
    <!-- Cuchillo -->
    <g transform="translate(2, -2)">
      <rect x="-0.2" y="0" width="0.4" height="4" fill="#E67E22"/>
      <ellipse cx="0" cy="-1" rx="0.6" ry="1" fill="#E67E22"/>
    </g>
  </g>
  
  <!-- Botón inferior -->
  <circle cx="20" cy="32" r="0.8" fill="#4A9B9B"/>
</svg>